# Render blueprint for Kuik.
# Deploy: push to GitHub, then "New +" → "Blueprint" in the Render dashboard.
services:
  - type: web
    name: kuik
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        value: kuik.mx
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.kuik.mx
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_PLAN_AMOUNT
        value: "299"
      - key: MERCADOPAGO_PRO_AMOUNT
        value: "499"
      - key: MERCADOPAGO_PLAN_CURRENCY
        value: MXN
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: KUIK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:soporte@kuik.mx
      - key: NEXT_PUBLIC_META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: NEXT_PUBLIC_META_CONFIG_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_BRIDGE_URL
        sync: false
      - key: WHATSAPP_BRIDGE_SECRET
        sync: false
      - key: AI_DEFAULT_PROVIDER
        value: deepseek
      - key: AI_DEEPSEEK_KEY
        sync: false
      - key: AI_OPENAI_KEY
        sync: false
      - key: AI_GEMINI_KEY
        sync: false
      - key: AI_ANTHROPIC_KEY
        sync: false
      - key: AI_KIMI_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      # Download folder for the POS print agent binaries (print-agent/build.sh).
      - key: NEXT_PUBLIC_PRINT_AGENT_URL
        value: https://drive.google.com/drive/folders/1sHQck1nZch8xO52dsdpF1jcIzjrJoHwz?usp=drive_link

  # Daily trial/subscription reconciliation.
  - type: cron
    name: kuik-expire-trials
    runtime: node
    schedule: "0 6 * * *" # 06:00 UTC daily
    plan: starter
    buildCommand: "echo no build"
    startCommand: >
      curl -fsS -H "Authorization: Bearer $CRON_SECRET"
      https://app.kuik.mx/api/cron/expire-trials
    envVars:
      # Inherited from the web service rather than declared again: a separate
      # `sync: false` copy starts empty, and the job just 401s on every run
      # (curl -f exits 22) with nothing to say why.
      - key: CRON_SECRET
        fromService:
          name: kuik
          type: web
          envVarKey: CRON_SECRET

  # 24-hour reservation reminders.
  # Hourly, not daily: a booking can be at any time, and the job claims the
  # one-hour window that sits exactly 24h out. Claiming is idempotent, so an
  # overlapping or retried run costs nothing.
  - type: cron
    name: kuik-reservation-reminders
    runtime: node
    schedule: "5 * * * *" # every hour at :05
    plan: starter
    buildCommand: "echo no build"
    startCommand: >
      curl -fsS -H "Authorization: Bearer $CRON_SECRET"
      https://app.kuik.mx/api/cron/reservation-reminders
    envVars:
      # Inherited from the web service rather than declared again: a separate
      # `sync: false` copy starts empty, and the job just 401s on every run
      # (curl -f exits 22) with nothing to say why.
      - key: CRON_SECRET
        fromService:
          name: kuik
          type: web
          envVarKey: CRON_SECRET

  # WhatsApp housekeeping: re-runs webhook events that never finished, warns
  # before Coexistence drops an idle number at 14 days, and prunes old payloads.
  - type: cron
    name: kuik-whatsapp-maintenance
    runtime: node
    schedule: "*/5 * * * *"
    plan: starter
    buildCommand: "echo no build"
    startCommand: >
      curl -fsS -H "Authorization: Bearer $CRON_SECRET"
      https://app.kuik.mx/api/cron/whatsapp-maintenance
    envVars:
      # Inherited from the web service rather than declared again: a separate
      # `sync: false` copy starts empty, and the job just 401s on every run
      # (curl -f exits 22) with nothing to say why.
      - key: CRON_SECRET
        fromService:
          name: kuik
          type: web
          envVarKey: CRON_SECRET

  # whatsmeow bridge: one linked-device WhatsApp session per restaurant.
  # Stateful and long-running by nature, so it cannot live inside the web
  # service. Read whatsapp-bridge/README.md before enabling this in production.
  - type: web
    name: kuik-whatsapp-bridge
    runtime: go
    plan: starter
    rootDir: whatsapp-bridge
    buildCommand: go build -o bridge ./...
    startCommand: ./bridge
    healthCheckPath: /health
    envVars:
      # go.mod requires 1.26 (whatsmeow does). Without this Render may build
      # with an older toolchain and fail with "go.mod requires go >= 1.26.0".
      - key: GO_VERSION
        value: "1.26.0"
      # Seconds to wait before reconnecting WhatsApp on boot, so a deploy's
      # old instance is gone first. See the note in main.go.
      - key: STARTUP_DELAY_SECONDS
        value: "30"
      - key: BRIDGE_SECRET
        sync: false
      - key: KUIK_WEBHOOK_URL
        value: https://app.kuik.mx/api/webhooks/whatsapp/bridge
      # Must pin a non-public schema: whatsmeow's tables hold session keys, and
      # anything in `public` is published by Supabase's REST API. Run
      # `create schema if not exists whatsmeow;` first, then append
      # `?sslmode=require&search_path=whatsmeow` to the connection string.
      # The service refuses to boot otherwise.
      - key: DATABASE_URL
        sync: false
