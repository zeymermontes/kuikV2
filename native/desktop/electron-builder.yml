appId: mx.kuik.desktop
productName: Kuik Caja
copyright: Kuik
directories:
  output: dist
# One name per platform and version, no spaces: the publish script and the
# update feed (latest*.yml) refer to these.
artifactName: kuik-caja-${version}-${os}-${arch}.${ext}
# electron-updater: the app checks this folder of the public apps bucket for
# a newer version (native/scripts/publish-desktop.mjs keeps it current).
publish:
  provider: generic
  url: https://efejxzvcsixwzwcqocqf.supabase.co/storage/v1/object/public/apps/desktop
files:
  - main.js
  - preload.js
  - setup.html
  - package.json
# The print agent binaries (print-agent/build.sh via scripts/build-agent.sh).
# Each installer carries only its own platform's.
mac:
  category: public.app-category.business
  target: [dmg, zip]
  extraResources:
    - from: agent/
      to: agent/
      filter: ["kuik-print-agent-darwin-*"]
win:
  target: nsis
  extraResources:
    - from: agent/
      to: agent/
      filter: ["kuik-print-agent-windows-*"]
linux:
  target: [AppImage, deb]
  category: Office
  extraResources:
    - from: agent/
      to: agent/
      filter: ["kuik-print-agent-linux-*"]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
